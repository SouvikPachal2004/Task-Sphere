<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Connection Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>TaskSphere API Connection Test</h1>
    
    <div id="status" class="status info">
        Testing API connection...
    </div>
    
    <div>
        <button onclick="testHealth()">Test Health Endpoint</button>
        <button onclick="testAuth()">Test Auth Endpoint</button>
        <button onclick="clearLog()">Clear Log</button>
    </div>
    
    <div id="log"></div>

    <script>
        const API_URL = 'https://tasksphere-web-production.up.railway.app/api';
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += `<div class="status ${type}">[${timestamp}] ${message}</div>`;
            console.log(`[${timestamp}] ${message}`);
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
        
        async function testHealth() {
            try {
                log('Testing health endpoint...', 'info');
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();
                
                if (response.ok) {
                    log(`✅ Health check successful: ${data.message}`, 'success');
                    document.getElementById('status').innerHTML = '✅ Backend connection working!';
                    document.getElementById('status').className = 'status success';
                } else {
                    log(`❌ Health check failed: ${response.status}`, 'error');
                }
            } catch (error) {
                log(`❌ Health check error: ${error.message}`, 'error');
                document.getElementById('status').innerHTML = '❌ Backend connection failed!';
                document.getElementById('status').className = 'status error';
            }
        }
        
        async function testAuth() {
            try {
                log('Testing auth endpoint...', 'info');
                const response = await fetch(`${API_URL}/auth/test`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    log(`✅ Auth endpoint accessible: ${JSON.stringify(data)}`, 'success');
                } else {
                    log(`ℹ️ Auth endpoint returned: ${response.status} (expected for protected route)`, 'info');
                }
            } catch (error) {
                log(`❌ Auth test error: ${error.message}`, 'error');
            }
        }
        
        // Auto-test on page load
        window.onload = function() {
            log('🔧 API Configuration loaded', 'info');
            log(`🔗 API URL: ${API_URL}`, 'info');
            log(`📍 Current domain: ${window.location.hostname}`, 'info');
            
            // Auto-test health endpoint
            setTimeout(testHealth, 1000);
        };
    </script>
</body>
</html>
