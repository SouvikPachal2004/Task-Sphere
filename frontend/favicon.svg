<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#gradient)" stroke="#ffffff" stroke-width="1"/>
  
  <!-- Task checkmark icon -->
  <g fill="#ffffff" stroke="#ffffff" stroke-width="0.5">
    <!-- First task line with checkmark -->
    <rect x="7" y="9" width="8" height="1.5" rx="0.75" fill="#ffffff"/>
    <path d="M17 9.75 L19 11.75 L23 7.75" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Second task line with checkmark -->
    <rect x="7" y="13" width="6" height="1.5" rx="0.75" fill="#ffffff"/>
    <path d="M15 13.75 L17 15.75 L21 11.75" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Third task line (in progress) -->
    <rect x="7" y="17" width="10" height="1.5" rx="0.75" fill="#ffffff"/>
    <circle cx="19" cy="17.75" r="1.5" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    
    <!-- Fourth task line (pending) -->
    <rect x="7" y="21" width="7" height="1.5" rx="0.75" fill="rgba(255,255,255,0.6)"/>
    <rect x="16" y="21" width="3" height="1.5" rx="0.75" fill="rgba(255,255,255,0.3)"/>
  </g>
</svg>