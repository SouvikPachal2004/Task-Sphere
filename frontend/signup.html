<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <i class="fas fa-tasks"></i>
                <span>TaskFlow</span>
            </a>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle">
                    <i class="fas fa-moon"></i>
                </button>
                <a href="login.html" class="btn btn-secondary">Login</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="auth-container">
        <div class="auth-wrapper">
            <!-- Left Side - Info -->
            <div class="auth-info">
                <div class="info-content">
                    <h2>Join TaskFlow</h2>
                    <p>Create your account and start managing tasks efficiently</p>
                    <div class="info-features">
                        <div class="info-feature">
                            <i class="fas fa-check-circle"></i>
                            <span>Role-based access control</span>
                        </div>
                        <div class="info-feature">
                            <i class="fas fa-check-circle"></i>
                            <span>Team collaboration</span>
                        </div>
                        <div class="info-feature">
                            <i class="fas fa-check-circle"></i>
                            <span>Real-time analytics</span>
                        </div>
                        <div class="info-feature">
                            <i class="fas fa-check-circle"></i>
                            <span>Secure authentication</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Side - Form -->
            <div class="auth-form-wrapper">
                <form id="signupForm" class="auth-form">
                    <h3>Create Account</h3>

                    <!-- Alert Messages -->
                    <div id="alertContainer"></div>

                    <!-- Full Name -->
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <div class="input-group">
                            <i class="fas fa-user input-icon"></i>
                            <input 
                                type="text" 
                                id="fullName" 
                                name="fullName" 
                                placeholder="Enter your full name"
                                required
                            >
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-group">
                            <i class="fas fa-envelope input-icon"></i>
                            <input 
                                type="email" 
                                id="email" 
                                name="email" 
                                placeholder="Enter your email"
                                pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
                                title="Please enter a valid email address"
                                required
                            >
                        </div>
                    </div>

                    <!-- Position -->
                    <div class="form-group">
                        <label for="position">Position/Title</label>
                        <div class="input-group">
                            <i class="fas fa-briefcase input-icon"></i>
                            <input 
                                type="text" 
                                id="position" 
                                name="position" 
                                placeholder="e.g., Software Developer, Manager"
                                required
                            >
                        </div>
                    </div>

                    <!-- Role Selection -->
                    <div class="form-group">
                        <label for="role">Select Role</label>
                        <div class="role-selector">
                            <div class="role-option" data-role="employee">
                                <input type="radio" id="roleEmployee" name="role" value="employee" checked>
                                <label for="roleEmployee" class="role-label">
                                    <i class="fas fa-user"></i>
                                    <span>Employee</span>
                                </label>
                            </div>
                            <div class="role-option" data-role="admin">
                                <input type="radio" id="roleAdmin" name="role" value="admin">
                                <label for="roleAdmin" class="role-label">
                                    <i class="fas fa-user-tie"></i>
                                    <span>Admin</span>
                                </label>
                            </div>
                            <div class="role-option" data-role="superadmin">
                                <input type="radio" id="roleSuperAdmin" name="role" value="superadmin">
                                <label for="roleSuperAdmin" class="role-label">
                                    <i class="fas fa-user-shield"></i>
                                    <span>Super Admin</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Security Code (Conditional) -->
                    <div class="form-group" id="securityCodeGroup" style="display: none;">
                        <label for="securityCode">Security Code</label>
                        <div class="input-group">
                            <i class="fas fa-key input-icon"></i>
                            <input 
                                type="password" 
                                id="securityCode" 
                                name="securityCode" 
                                placeholder="Enter security code"
                            >
                        </div>
                        <small class="code-hint" id="codeHint"></small>
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-group">
                            <i class="fas fa-lock input-icon"></i>
                            <input 
                                type="password" 
                                id="password" 
                                name="password" 
                                placeholder="Enter password (min 8 characters)"
                                required
                            >
                            <button type="button" class="toggle-password" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="password-strength" id="passwordStrength"></div>
                    </div>

                    <!-- Confirm Password -->
                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="input-group">
                            <i class="fas fa-lock input-icon"></i>
                            <input 
                                type="password" 
                                id="confirmPassword" 
                                name="confirmPassword" 
                                placeholder="Confirm password"
                                required
                            >
                            <button type="button" class="toggle-password" id="toggleConfirmPassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Terms & Conditions -->
                    <div class="form-group checkbox-group">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">I agree to the Terms & Conditions</label>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn btn-primary btn-block">
                        <span id="submitText">Create Account</span>
                        <span id="submitSpinner" class="spinner" style="display: none;"></span>
                    </button>

                    <!-- Login Link -->
                    <p class="auth-link">
                        Already have an account? <a href="login.html">Login here</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
